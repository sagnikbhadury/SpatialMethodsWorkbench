name: R tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::DT
            any::ggplot2
            any::jsonlite
            any::markdown
            any::zip
            any::testthat
            any::knitr
            any::rmarkdown
      - name: Parse application
        run: Rscript -e "files <- c('app.R', list.files('R', full.names=TRUE, pattern='[.]R$')); invisible(lapply(files, parse))"
      - name: Run tests
        run: Rscript tests/testthat.R
      - name: Audit complete release contents
        run: Rscript audit-release.R
      - name: Build package and all vignettes
        run: R CMD build .
